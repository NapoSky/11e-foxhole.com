nodeLinker: node-modules

yarnPath: .yarn/releases/yarn-4.12.0.cjs

# eslint-plugin-react@7.x ne déclare pas encore le support eslint ^10 dans ses peerDeps,
# mais fonctionne correctement avec eslint 10. On supprime le warning connu jusqu'à leur mise à jour.
logFilters:
  - code: YN0060
    text: "eslint-plugin-react"
    level: discard
  - code: YN0086
    level: discard

