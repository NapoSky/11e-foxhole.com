name: Staging Tests and Auto-Promote

on:
  push:
    branches:
      - staging
    paths-ignore:
      - "src/images/**"
  schedule:
    - cron: "0 8 * * 1"

jobs:
  functional-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Set up project
        uses: ./.github/actions/setup

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml', '.node-version') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'src/locales/**/*.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml', '.node-version') }}-

      - name: Test tooling guards
        run: pnpm run test:tooling

      - name: Run lint
        run: pnpm run lint

      - name: Check workflow formatting
        run: pnpm run lint:workflows

      - name: Build site
        run: pnpm run build

      - name: Install Playwright Chromium browser
        run: pnpm exec playwright install chromium --with-deps

      - name: Run functional tests
        run: pnpm run test

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-staging
          path: playwright-report/
          retention-days: 14

  open-promotion-pr:
    runs-on: ubuntu-latest
    needs: functional-tests
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Check for existing promotion PR
        id: check-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING=$(gh pr list --base main --head staging --state open --json number --jq '.[0].number // empty')
          echo "existing=$EXISTING" >> $GITHUB_OUTPUT

      - name: Check for commits ahead of main
        id: diff-check
        run: |
          git fetch origin main
          AHEAD=$(git rev-list --count origin/main..HEAD)
          echo "ahead=$AHEAD" >> $GITHUB_OUTPUT

      - name: Open promotion PR staging → main
        if: steps.check-pr.outputs.existing == '' && steps.diff-check.outputs.ahead != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base main \
            --head staging \
            --title "chore: promote staging to main [auto]" \
            --body "$(cat <<'EOF'
          ## Promotion automatique : staging → main

          Tous les tests fonctionnels ont passé sur le build staging. Ce PR a été ouvert automatiquement.

          ### Couverture des tests
          - Toutes les sections de page rendues (Description, Activités, Opérations, Officiers, Footer)
          - Ancres de section présentes dans le DOM
          - Liens sociaux Discord et YouTube présents
          - Hamburger visible à 375px, masqué à 1280px
          - Drawer mobile ouverture/fermeture (hamburger et backdrop)
          - Sélecteur de langue dans le drawer et la nav desktop
          - Smoke test page /en

          ### Avant de merger
          - [ ] Vérifier le rendu sur le déploiement preview Cloudflare Pages (staging)
          - [ ] Relire les changements de contenu inclus dans ce batch
          EOF
          )"

      - name: Comment on existing PR if already open
        if: steps.check-pr.outputs.existing != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ steps.check-pr.outputs.existing }} \
            --body "Tests fonctionnels passés sur le commit \`${{ github.sha }}\`. Ce PR est prêt à merger."
