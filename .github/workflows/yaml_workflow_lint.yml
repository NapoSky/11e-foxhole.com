name: Lint YAML files

on:
  pull_request:
    paths:
      - ".github/**/*.yml"
      - ".github/**/*.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".node-version"
    branches:
      - main
      - staging

permissions:
  contents: read

jobs:
  lint-yaml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up project
        uses: ./.github/actions/setup

      - name: Check YAML files with pinned Prettier
        run: pnpm run lint:workflows
