name: Pull Request CI

on:
  pull_request:
    paths-ignore:
      - "src/images/**"
    branches:
      - main
      - staging

jobs:
  code-linter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up project
        uses: ./.github/actions/setup

      - name: Test tooling guards
        run: pnpm run test:tooling

      - name: Check workflow formatting
        run: pnpm run lint:workflows

      - name: Run lint
        run: pnpm run lint

  functional-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up project
        uses: ./.github/actions/setup

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml', '.node-version') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'src/locales/**/*.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml', '.node-version') }}-

      - name: Build site
        run: pnpm run build

      - name: Install Playwright Chromium browser
        run: pnpm exec playwright install chromium --with-deps

      - name: Run functional tests
        run: pnpm run test

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
