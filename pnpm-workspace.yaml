# Node version selection is shared by local development, CI and Cloudflare.
engineStrict: true
verifyDepsBeforeRun: error

# Native dependencies used by Next.js and Sass; unknown install scripts fail.
allowBuilds:
  "@parcel/watcher": true
  sharp: true
  unrs-resolver: true

# eslint-plugin-react 7 supports our configuration but does not yet declare ESLint 10.
peerDependencyRules:
  allowedVersions:
    "eslint-plugin-react>eslint": "10"

overrides:
  "string-width": "^7.1.2"
  "string-width-cjs": "npm:string-width@^5.1.1"
  "strip-ansi": "^7.0.1"
  "strip-ansi-cjs": "npm:strip-ansi@^8.0.0"
  "@babel/core": "^7.29.6"
  "baseline-browser-mapping": "^2.11.0"
  "brace-expansion@^1.1.7": "^1.1.16"
  "brace-expansion@^5.0.5": "^5.0.7"
  "browserslist": "^4.28.7"
  "fast-uri": "^3.1.6"
  "@humanfs/node": "^0.16.8"
  "immutable": "^5.1.8"
  "postcss-selector-parser": "^7.1.3"
  "tar": "^7.5.21"
  "undici": "^6.28.0"
  compression@<1.8.2: ^1.8.2
  minimatch@<11.0.1: ^11.0.1
